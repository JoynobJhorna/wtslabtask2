<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <style>
     h1 {
            text-align: center;
            color: red;
        }
 
 button {
            padding: 10px 15px;
            background-color: #c0392b;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
        }
         table {
            
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }
 
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
 
        th {
            background-color: #c0392b;
            color: white;
        }
   </style>
  
   <center>
   <h1>Blood Donor Registration</h1>
    <form action="form-handler.html" method="post">
   <label for="first-name">Full Name:</label>
                <input type="text" class="name-field" id="first-name" name="fn" placeholder="Enter your first name" minlength="3" required />
                <br />
                 <label for="id">ALUB ID:</label>
                <input type="text" class="id-field" id="id" name="id" placeholder="Enter your ID" minlength="3" required />
                <br /> 
                <label for="number">Mobile:</label>
                <input type="number" class="number-field" id="number" name="nm" placeholder="Enter your mobile number" minlength="3" required />
                <br /> 
                <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="100" required />
            <br />

                <label for="blood group">blood group</label>      
            <select>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="O-">O-</option>
            </select>
            <br />
            

           
             <label>Donated before?</label>
 
            <input type="radio" id="donated-yes"
                   name="donated" value="Yes" required>
            <label for="donated-yes" style="display:inline;">Yes</label>
            <input type="radio" id="donated-no"
                   name="donated" value="No" required>
            <label for="donated-no" style="display:inline;">No</label>
 
            <br>
             <label for="agree" >
                I am healthy and willing to donate
            </label>
 
            <br>
           
 
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass"
                   required minlength="6">
            <br>
 
            <label for="pass2">Confirm Password:</label>
            <input type="password" id="pass2" name="pass2"
                   required>
           <br>

 
            <button type="submit">Register Donor</button>
 
 
                </form>
                
                 <p id="count">Total donors: 0</p>
 
        <table id="list">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Blood Group</th>
                    <th>Action</th>
                </tr>
            </thead>
 
            <tbody id="donorBody">
            </tbody>
        </table>

        </center>
         <script>
     function validateForm() {
 
            let valid = true;
 
            let name = document.getElementById("fname").value.trim();
            let sid = document.getElementById("sid").value;
            let phone = document.getElementById("phone").value;
            let age = document.getElementById("age").value;
            let group = document.getElementById("bgroup").value;
            let pass = document.getElementById("pass").value;
            let pass2 = document.getElementById("pass2").value;
     }
 
   </script>
</body>
</html>
